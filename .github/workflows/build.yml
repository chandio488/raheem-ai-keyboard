name: Build Raheem AI Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo (build recipe)
        uses: actions/checkout@v4

      - name: Fetch pinned upstream Indic Keyboard (recursive submodules)
        run: |
          git clone --recursive https://github.com/smc/Indic-Keyboard.git src
          cd src
          git checkout e5bee019d57a1d106799dffd6f5d429caa447e07
          git submodule update --init --recursive

      - name: Apply Raheem AI Keyboard v1 rebrand
        run: bash apply-raheem.sh src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 37 and build-tools 37.0.0
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || \
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Generate Gradle wrapper and build debug APK
        working-directory: src/java
        run: |
          gradle wrapper --gradle-version 9.5.1
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raheem-ai-keyboard-debug-apk
          path: src/java/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Attach APKs to a GitHub release (public verification download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: Raheem AI Keyboard v1.0 (build ${{ github.run_number }})
          files: src/java/build/outputs/apk/**/debug/*.apk
