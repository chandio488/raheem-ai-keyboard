name: Build Raheem AI Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout this repo (build recipe)
        uses: actions/checkout@v4

      - name: Fetch pinned upstream Indic Keyboard (recursive submodules)
        run: |
          git clone --recursive https://github.com/smc/Indic-Keyboard.git src
          cd src
          git checkout e5bee019d57a1d106799dffd6f5d429caa447e07
          git submodule update --init --recursive

      - name: Apply Raheem AI ULTRA repack + single feature update
        run: bash apply-raheem-ultra.sh src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install SDK platform 37 and build-tools 37.0.0
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          SDKMAN="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMAN" ] && command -v sdkmanager >/dev/null 2>&1; then SDKMAN="$(command -v sdkmanager)"; fi
          if [ -z "$SDKMAN" ]; then
            echo "sdkmanager not found on runner; downloading command line tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMAN"
          ls -l "$SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;android-37.0" || "$SDKMAN" "platforms;android-37"
          "$SDKMAN" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > src/java/local.properties

      - name: Generate ephemeral CI keystore (final release signing is applied afterwards under controlled custody)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-ephemeral.jks" -storepass ci-ephemeral -keypass ci-ephemeral -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Ephemeral" -storetype PKCS12
          {
            echo "INDIC_KEYSTORE=$RUNNER_TEMP/ci-ephemeral.jks"
            echo "INDIC_KEYSTORE_PASSWORD=ci-ephemeral"
            echo "INDIC_KEY_ALIAS=ci"
            echo "INDIC_KEY_PASSWORD=ci-ephemeral"
          } >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper and build release APK (online flavor)
        working-directory: src/java
        run: |
          gradle wrapper --gradle-version 9.5.1
          ./gradlew assembleOnlineRelease --stacktrace

      - name: Remove ephemeral keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ci-ephemeral.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raheem-ai-ultra-update-apk
          path: src/java/build/outputs/apk/online/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to a GitHub release (public verification download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-build-${{ github.run_number }}
          name: Raheem AI ULTRA v1.1 update (build ${{ github.run_number }})
          files: src/java/build/outputs/apk/online/release/*.apk
